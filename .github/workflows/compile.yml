name: Compile

# Compiles every C file for both versions. Matching needs the base ROMs, which CI doesn't have, so `ninja` with your
# own dumps remains the check that a change matches.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    name: Compile src/ and lib/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache tools
        uses: actions/cache@v4
        with:
          path: |
            tools/wibo
            tools/objdiff-cli
            tools/mwccarm
          key: tools-${{ hashFiles('configure.py', 'lib/*/library.toml') }}

      - name: Compile
        run: python tools/scripts/compile_all.py
